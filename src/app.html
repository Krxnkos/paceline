<!doctype html>
<html lang="en-GB" data-theme="carbon">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Paceline — timeboxing, priorities and honest forecasts for people who build things."
		/>
		<meta name="theme-color" content="#0B0C0E" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap"
		/>
		<script>
			// Runs before first paint so the theme never flashes.
			(() => {
				const ids = ['carbon', 'chalk', 'midnight', 'frost', 'ember', 'sand'];
				let c = 'system';
				try {
					c = localStorage.getItem('pl-theme') ?? 'system';
				} catch {}
				const light = matchMedia('(prefers-color-scheme: light)').matches;
				document.documentElement.dataset.theme = ids.includes(c) ? c : light ? 'chalk' : 'carbon';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
